name: Bug Report
description: Create a report to help us improve AvC
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in AvC!
  - type: input
    id: version
    attributes:
      label: AvC Version or Git Commit
      placeholder: e.g., v1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Backend (FastAPI / WebSocket)"
        - "AI Inference Engine (ONNX / AASIST)"
        - "Frontend Dashboard (React / Vite)"
        - "Docker / Databases (Redis / PostgreSQL)"
        - "Scripts & Tooling"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps.
      placeholder: |
        1. Start backend with `...`
        2. Stream audio sample `...`
        3. See error in logs...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, Node.js version, GPU/CPU info.
      value: |
        - OS: [e.g. Ubuntu 24.04, macOS Sonoma, Windows 11]
        - Python Version: [e.g. 3.11.4]
        - Node Version: [e.g. 20.10.0]
        - Hardware: [CPU / CUDA GPU]
    validations:
      required: true
